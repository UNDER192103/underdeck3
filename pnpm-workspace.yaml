packages:
  - "apps/desktop/client"
  - "apps/desktop/electron"
  - "apps/remote"

# Instalações comuns usam o lockfile já versionado como fonte confiável. A
# verificação completa continua sendo executada explicitamente pelo comando
# `pnpm run hasupdate` quando as dependências são alteradas.
preferFrozenLockfile: true
trustLockfile: true
# O pnpm 12 pode iniciar um `pnpm install` implicitamente antes de cada
# `pnpm run`. Neste workspace isso também dispara rebuilds nativos pesados;
# as instalações são feitas somente pelos scripts explícitos acima.
verifyDepsBeforeRun: false

# discord-rpc declares register-scheme as an optional GitHub tarball.
# Keep this legacy dependency installable with pnpm's exotic-subdependency guard.
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - '@mongodb-js/saslprep@1.5.2'
  - '@types/node@26.5.0'
  - electron-to-chromium@1.5.423
  - emoji-picker-react@4.20.2
  - lucide-react@1.42.0
  - tldts-core@7.4.12
  - tldts-experimental@7.4.12

allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  electron: true
  electron-rebuild: true
  electron-winstaller: true
  esbuild: true
  es5-ext: true
  pnpm: true
  "register-scheme@https://codeload.github.com/devsnek/node-register-scheme/tar.gz/e7cc9a63a1f512565da44cb57316d9fb10750e17": true
  robotjs: true
  sharp: true
  uiohook-napi: true
